[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aoc-magic-studio-standalone"
dynamic = ["version"]
description = "AOC Magic Studio, standalone edition: numpy-only speech, vocal arrangement, mixing, MIDI and pitch tools"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
aoc = "aoc.cli:main"

[tool.setuptools]
packages = ["aoc"]

[tool.setuptools.dynamic]
version = {attr = "aoc.__version__"}
