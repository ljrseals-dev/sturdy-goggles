name: ci
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.9",  numpy: "1.21.6"}   # minimum supported
          - {os: ubuntu-latest, python: "3.10", numpy: ""}
          - {os: ubuntu-latest, python: "3.11", numpy: ""}
          - {os: ubuntu-latest, python: "3.12", numpy: ""}
          - {os: ubuntu-latest, python: "3.13", numpy: ""}
          - {os: macos-latest,  python: "3.12", numpy: ""}
          - {os: windows-latest, python: "3.12", numpy: ""}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -n "${{ matrix.numpy }}" ]; then pip install "numpy==${{ matrix.numpy }}"; else pip install numpy; fi
          pip install pytest
      - name: doctor
        run: python -m aoc doctor
      - name: tests
        run: python -m pytest -q tests
      - name: tests (no pytest runner)
        run: python tools/run_tests.py
      - name: reproducible pyz
        shell: bash
        run: |
          python tools/build_pyz.py /tmp/a.pyz
          python tools/build_pyz.py /tmp/b.pyz
          python -c "import hashlib,sys;h=lambda p:hashlib.sha256(open(p,'rb').read()).hexdigest();assert h('/tmp/a.pyz')==h('/tmp/b.pyz')"
